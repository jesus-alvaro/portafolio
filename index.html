<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesús Alvaro · Fotografía y video en Monterrey</title>
<meta name="description" content="Portafolio de Jesús Alvaro: fotografía y video de conciertos, XV años, bodas y eventos sociales en Monterrey.">
<meta property="og:title" content="Jesús Alvaro · Fotografía y video">
<meta property="og:description" content="XV años, bodas y conciertos en Monterrey.">
<meta property="og:image" content="img/portada.webp">
<link rel="icon" href="img/logo.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
a:hover{opacity:.8}
button{font-family:inherit}
button:hover{opacity:.92}
.vf{position:relative}
.vf i{position:absolute;display:block;width:26px;height:26px;border:0 solid currentColor;z-index:2}
.vf .tl{top:10px;left:10px;border-top-width:2px;border-left-width:2px}
.vf .tr{top:10px;right:10px;border-top-width:2px;border-right-width:2px}
.vf .bl{bottom:10px;left:10px;border-bottom-width:2px;border-left-width:2px}
.vf .br{bottom:10px;right:10px;border-bottom-width:2px;border-right-width:2px}
@media(max-width:760px){
header{padding:12px 16px!important}
header img{height:42px!important}
header nav{gap:0 18px!important}
header nav a{padding:8px 0!important}
#inicio{aspect-ratio:4/5!important}
#inicio .hx{left:20px!important;right:20px!important;bottom:28px!important;max-width:none!important}
#inicio h1{font-size:24px!important}
#portafolio{padding:56px 16px!important;gap:28px!important}
h2{font-size:32px!important}
#servicios>div,#contacto>div{padding:56px 16px!important}
#sobre-mi{padding:56px 16px!important;gap:32px!important}
#sobre-mi>div:first-child{max-width:260px!important}
#contacto h2{font-size:34px!important}
#contacto .vf{padding:32px 20px!important}
footer{padding:20px 16px!important}
}
.ov-btn{font-family:inherit;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:13px 18px;border:1px solid #6a6761;background:transparent;color:#f4f2ee}
.ov-btn:hover{opacity:.85}
.og{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vis{scrollbar-width:none}
.vis::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;font-size:24px;line-height:1;color:#f4f2ee;background:rgba(10,10,10,.75);border:1px solid #6a6761;cursor:pointer;z-index:3}
@media(min-width:900px){.og{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(max-width:760px){.arr{width:40px;height:40px;margin-top:-20px;font-size:20px}.ov-top{padding:12px 16px!important}.ov-t{font-size:20px!important}.ov-btn{padding:11px 13px}}

@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
header{animation:drop .7s ease-out both}
#inicio .hx>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
#inicio .hx>*:nth-child(1){animation-delay:.1s}
#inicio .hx>*:nth-child(2){animation-delay:.25s}
#inicio .hx>*:nth-child(3){animation-delay:.4s}
#inicio .hx>*:nth-child(4){animation-delay:.55s}
#inicio img{animation:drift 22s ease-in-out infinite alternate}
#inicio span[style*="width: 8px"]{animation:pulse 2.4s ease-in-out infinite}
.vf i{transition:top .35s,left .35s,right .35s,bottom .35s}
a,.ov-btn,.arr{transition:transform .25s,opacity .25s,background .25s}
a[href^="https://wa.me"]:hover,a[href^="mailto"]:hover,a[href^="https://instagram"]:hover{transform:translateY(-3px);opacity:1}
.ov{animation:fadein .3s ease-out both}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes vfa{from{opacity:0}to{opacity:1}}
@keyframes vfb{from{opacity:0}to{opacity:1}}
.v0{animation:vfa .45s ease-out both}
.v1{animation:vfb .45s ease-out both}
.ov.out{animation:fadeout .26s ease-in both}
.qm.out{animation:fadeout .24s ease-in both}
.mn{animation:fadein .28s ease-out both}
.mn .mi{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.mn .mi:nth-child(2){animation-delay:.05s}.mn .mi:nth-child(3){animation-delay:.11s}.mn .mi:nth-child(4){animation-delay:.17s}
.mn.out{animation:fadeout .22s ease-in both}
.mn.out .mi{animation:none}
#ovs,.vis,.qc{overscroll-behavior:contain}
.ov img{animation:fadein .6s ease-out both}
.ov .og button{animation:pop .5s ease-out both}
.ov .se .sd{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,.55);opacity:0;transition:opacity .5s}
.ov .se .sn{position:absolute;left:0;right:0;top:50%;padding:0 14px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;opacity:0;transform:translateY(-35%);transition:opacity .5s,transform .5s;z-index:2;line-height:1.6}
.ov .se:hover .sd,.ov .se:focus-visible .sd{opacity:1}
.ov .se:hover .sn,.ov .se:focus-visible .sn{opacity:1;transform:translateY(-50%)}
.ov .og:has(.se){gap:6px}
@media(hover:none){.ov .se .sd{opacity:.35}.ov .se .sn{opacity:1;transform:translateY(-50%);font-size:10px;letter-spacing:.22em}}
.ov .og button:nth-child(2){animation-delay:.06s}
.ov .og button:nth-child(3){animation-delay:.12s}
.ov .og button:nth-child(4){animation-delay:.18s}
.ov .og button:nth-child(5){animation-delay:.24s}
.ov .og button:nth-child(6){animation-delay:.3s}
@supports (animation-timeline: view()){
#portafolio>div:first-child,.g5>sc-w>button,#servicios h2,#servicios [style*="border: 1px solid"],#sobre-mi>*,#contacto .vf,#portafolio>p{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.g5{display:flex;gap:6px;height:660px;width:100%}
.g5>sc-w>button{flex:1 1 0;min-width:0;position:relative;overflow:hidden;border:0;padding:0;background:#14110f;color:#f4f2ee;cursor:pointer;font-family:inherit;transition:flex .75s cubic-bezier(.2,.7,.2,1)}
.g5>sc-w>button:hover{flex:2.3 1 0}
.g5>sc-w>button img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.g5>sc-w>button:hover img{transform:scale(1.05)}
.g5>sc-w>button .dm{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,.5);opacity:0;transition:opacity .5s}
.g5>sc-w>button:hover .dm{opacity:1}
.g5>sc-w>button .cl{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:14px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;opacity:0;transform:translateY(-35%);transition:opacity .5s,transform .5s;z-index:2;padding-left:.34em}
.g5>sc-w>button:hover .cl{opacity:1;transform:translateY(-50%)}
.g5>sc-w>button i{opacity:0;transition:opacity .4s,top .4s,left .4s,right .4s,bottom .4s}
.g5>sc-w>button:hover i{opacity:1}
.g5>sc-w>button:hover i.tl{top:20px;left:20px}
.g5>sc-w>button:hover i.tr{top:20px;right:20px}
.g5>sc-w>button:hover i.bl{bottom:20px;left:20px}
.g5>sc-w>button:hover i.br{bottom:20px;right:20px}
.ov .og button img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ov .og button:hover img{transform:scale(1.07)}
@media(max-width:760px){
.g5{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;height:auto;box-sizing:border-box;padding:0 16px}
.g5>sc-w>button{aspect-ratio:4/5}
.g5>sc-w>button:last-child{grid-column:1/-1;aspect-ratio:16/10}
.g5>sc-w>button .dm{opacity:.38}
.g5>sc-w>button .cl{opacity:1;transform:translateY(-50%);font-size:12px}
.g5>sc-w>button i{display:none}
#portafolio{padding:48px 0 16px!important}
#portafolio>div,#portafolio>p{padding-left:16px!important;padding-right:16px!important}
}
.burger{display:none;width:44px;height:44px;background:transparent;border:0;cursor:pointer;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;padding:0}
.burger span{display:block;height:1.5px;background:#f4f2ee;width:24px}
.burger span:last-child{width:15px}
.cta{transition:background .3s,color .3s}
.cta:hover{background:#e5533d;color:#0a0a0a}
.mi{font-size:20px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#f4f2ee;padding-left:.24em}
.mi-c{color:#e5533d;border-bottom:1px solid #e5533d;padding-bottom:6px;margin-top:10px;font-size:14px}
@media(max-width:760px){
header{display:grid!important;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 16px!important}
header>a{grid-column:2;justify-self:center}
header img{height:38px!important}
.dnav{display:none!important}
.burger{display:flex;grid-column:3}
}
@media(max-width:760px){
header{padding-top:max(12px,env(safe-area-inset-top))!important}
.ov-top{padding-top:max(14px,env(safe-area-inset-top))!important}
}
.ov-cat{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.ov-ghost{font-family:inherit;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:12px 20px;border:1px solid rgba(244,242,238,.55);background:transparent;color:#f4f2ee;transition:background .3s,border-color .3s}
.ov-ghost:hover{background:rgba(244,242,238,.12);border-color:#f4f2ee}

.qs{display:flex;flex-direction:column;gap:14px}
.qn{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;background:#14130f;color:#f4f2ee;font-size:12px;font-weight:700}
.qs{position:relative}
.ql{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.qo{display:flex;flex-wrap:wrap;gap:10px}
.qo button{font-family:inherit;color:#14130f;background:transparent;border:1px solid #14130f;padding:14px 20px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;transition:background .25s,color .25s,transform .25s}
.qo button small{font-size:11px;font-weight:500;letter-spacing:.02em;text-transform:none;opacity:.75}
.qo button:hover{transform:translateY(-2px)}
.qo button.on{background:#14130f;color:#f4f2ee;border-color:#14130f}
.qo button.on small{opacity:.85}
.qd{font-family:inherit;font-size:15px;padding:13px 16px;border:1px solid #14130f;background:transparent;color:#14130f;max-width:240px}
.qm{position:fixed;top:0;left:0;right:0;bottom:0;z-index:65;background:rgba(10,10,10,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 16px;box-sizing:border-box;animation:fadein .25s both;font-family:'Montserrat',system-ui,sans-serif}
.qc{position:relative;background:#f0eee9;color:#14130f;width:100%;max-width:560px;max-height:100%;overflow-y:auto;box-sizing:border-box;padding:40px 32px 32px;display:flex;flex-direction:column;gap:26px;animation:pop .3s both}
.qx{position:absolute;top:12px;right:12px}
.qa{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.qc .qt-sum{padding-top:24px}
.qt-sum{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid #14130f;padding-top:28px}
.qwa{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#f4f2ee;background:#e5533d;padding:20px 32px;text-align:center}
@media (max-width:760px){.qt{padding:40px 22px!important;gap:32px!important}.qt h2{font-size:32px!important}.qo button{flex:1 1 calc(50% - 5px);padding:13px 14px}.qwa{width:100%;box-sizing:border-box}.qt-sum{flex-direction:column;align-items:stretch}}
</style>
<style>html,body{overflow-x:clip}</style>
<noscript><style>#app{display:none}</style></noscript>
</head>
<body>
<div id="app"></div>
<script type="text/x-tpl" id="tpl">
<div style="background: #0a0a0a; color: #f4f2ee; font-family: 'Montserrat', system-ui, sans-serif; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column">

<div style="position: relative">
<!-- NAV -->
<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px 32px; padding: 20px 32px; max-width: 1280px; width: 100%; box-sizing: border-box; margin: 0 auto">
<a onClick="{{smooth}}" href="#inicio" aria-label="Jesús Alvaro, inicio" style="display: block; padding: 6px 0"><img src="img/logo.png" alt="Jesús Alvaro" style="height: 52px; width: auto; display: block"></a>
<nav class="dnav" style="display: flex; align-items: center; gap: 4px 30px">
<a onClick="{{smooth}}" href="#portafolio" style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #d4d1cb; padding: 12px 0">Portafolio</a><a onClick="{{smooth}}" href="#sobre-mi" style="font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #d4d1cb; padding: 12px 0">Sobre mí</a><a onClick="{{smooth}}" href="#contacto" class="cta" style="font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #f4f2ee; border: 1px solid #e5533d; padding: 12px 20px">Cotiza tu sesión</a>
</nav>
<button class="burger" onClick="{{openMenu}}" aria-label="Abrir menú"><span></span><span></span></button>
</header>
<section id="inicio" style="position: relative; width: 100%; aspect-ratio: 3 / 2; max-height: 920px; overflow: hidden; background: #0a0a0a">
<img src="img/portada.webp" alt="Cantante en concierto levantada por bailarines sobre el escenario" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 40%; display: block">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0) 22%, rgba(10,10,10,0) 60%, rgba(10,10,10,0.7) 100%)"></div>
<div class="hx" style="position: absolute; left: 6%; bottom: 370px; max-width: 300px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: block; width: 8px; height: 8px; background: #e5533d"></span>
<span style="font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">XV años · Bodas · Conciertos</span>
</div>
<h1 style="margin: 0; font-weight: 800; font-size: 30px; line-height: 1.12; letter-spacing: 0.01em; text-transform: uppercase; width: 318px; max-width: 100%">Lo viviste una vez. Revívelo siempre.</h1>
</div>
</section>

</div>

<!-- PORTAFOLIO -->
<section id="portafolio" style="padding: 72px 0 32px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<div style="max-width: 1280px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 10px">
<span style="display: block; width: 8px; height: 8px; background: #e5533d"></span>
<span style="font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase">Portafolio</span>
</div>
<div class="g5">
<sc-for list="{{cats}}" as="c">
<button class="vf" onClick="{{c.open}}" aria-label="{{c.aria}}">
<img src="{{c.cover}}" alt="" style="object-position: {{c.pos}}">
<span class="dm"></span>
<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
<span class="cl">{{c.title}}</span>
</button>
</sc-for>
</div>
<p style="margin: 0 auto; max-width: 1280px; width: 100%; box-sizing: border-box; padding: 0 32px; font-size: 14px; color: #b5b2ac">¿Quieres ver más? Mira el día a día en <a href="https://instagram.com/jesus.alvaro_visuals" style="color: #f4f2ee; font-weight: 700; border-bottom: 2px solid #e5533d">@jesus.alvaro_visuals</a></p>
</section>

<!-- SERVICIOS (fondo claro, como el reverso de la tarjeta) -->


<!-- SOBRE MI -->
<section id="sobre-mi" style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 56px; padding: 96px 32px; max-width: 1280px; width: 100%; box-sizing: border-box; margin: 0 auto">
<div class="vf" style="flex: 0 1 340px; min-width: 0; aspect-ratio: 4 / 5; align-self: center; box-sizing: border-box; background: #0a0a0a; color: #f4f2ee; overflow: hidden">
<img src="img/retrato.webp" alt="Retrato de Jesús Alvaro, fotógrafo" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%">
</div>
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: block; width: 10px; height: 10px; background: #e5533d"></span>
<span style="font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase">Sobre mí</span>
</div>
<h2 style="margin: 0; font-weight: 800; font-size: 48px; line-height: 1.05; text-transform: uppercase">Hola, soy Jesús.</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.75; color: #d4d1cb; width: 677px; max-width: 100%">Fotógrafo y videógrafo en Monterrey. Capturo tus momentos reales para que los revivas siempre: trato cercano, sin poses forzadas y fotos listas para presumir.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid #6a6761; padding: 10px 14px">2 años de experiencia</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid #6a6761; padding: 10px 14px">Foto y video</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid #6a6761; padding: 10px 14px">Monterrey y área metropolitana</span></div>
</div>
</section>

<!-- CONTACTO (fondo claro) -->
<section id="contacto" style="background: #f0eee9; color: #14130f; width: 100%; box-sizing: border-box">
<div style="padding: 96px 32px; max-width: 1280px; width: 100%; box-sizing: border-box; margin: 0 auto">
<div class="vf qt" style="color: #14130f; box-sizing: border-box; padding: 64px 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 28px">
<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
<h2 style="margin: 0; font-weight: 800; font-size: 48px; line-height: 1.04; text-transform: uppercase">Tu sesión empieza aquí</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4a4843; max-width: 520px">Elige lo que necesitas en un par de toques y mándame el resumen por WhatsApp para cotizar.</p>
<button class="qwa" onClick="{{openQuote}}" style="border: 0; font-family: inherit; cursor: pointer">Arma tu sesión</button>
<p style="margin: 0; font-size: 14px; color: #4a4843">También puedes escribirme por <a href="https://instagram.com/jesus.alvaro_visuals" style="font-weight: 700; border-bottom: 2px solid #e5533d">Instagram</a> o <a href="mailto:contacto.jesusalvaro@gmail.com" style="font-weight: 700; border-bottom: 2px solid #e5533d">correo</a>. Respondo el mismo día.</p>
</div>
</div>
</section>

<!-- FOOTER -->
<footer style="margin-top: auto; padding: 32px; max-width: 1280px; width: 100%; box-sizing: border-box; margin-left: auto; margin-right: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: #b5b2ac">
<span>© 2026 Jesús Alvaro · Fotografía y video · Monterrey</span>
<a onClick="{{smooth}}" href="#inicio" style="color: #b5b2ac; padding: 8px 0">Volver arriba</a>
</footer>

<!-- COTIZADOR FLOTANTE -->
<sc-if value="{{quoteOpen}}">
<div class="{{qmCls}}" onClick="{{closeQuote}}">
<div class="qc" onClick="{{stop}}">
<button class="ov-ghost qx" onClick="{{closeQuote}}" aria-label="Cerrar" style="color: #14130f; border-color: #14130f">✕</button>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #e5533d">Arma tu sesión</span>
<div class="qs"><span class="ql">¿Qué vas a celebrar?</span>
<div class="qo"><sc-for list="{{tipos}}" as="o"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<sc-if value="{{showSes}}"><div class="qs qa"><span class="ql">¿Qué tipo de sesión?</span>
<div class="qo"><sc-for list="{{sess}}" as="o"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div></sc-if>
